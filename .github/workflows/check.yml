name: Check NeeDoh stock

# How it keeps running:
# each run checks the shops every ~2 minutes for about 45 minutes, then
# starts the next run itself. The schedule below is only a backup that
# restarts it if the chain ever stops.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Just send a test notification to my phone"
        type: boolean
        default: false

permissions:
  contents: write   # save state.json so you aren't alerted twice
  actions: write    # start the next run when this one finishes

concurrency:
  group: needoh-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test notification
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: "1"
        run: python needoh_watch.py

      - name: Check shops every 2 minutes for 45 minutes
        if: ${{ !inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "needoh-bot"
          git config user.email "needoh-bot@users.noreply.github.com"
          end=$((SECONDS + 45*60))
          while [ $SECONDS -lt $end ]; do
            git pull --quiet --rebase || true          # pick up any shop-list changes
            python needoh_watch.py || echo "check had an error, trying again next round"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit --quiet -m "Update stock state"
              git push --quiet || (git pull --quiet --rebase && git push --quiet) || true
            fi
            sleep 60
          done

      - name: Start the next run
        if: ${{ !cancelled() && !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref "${{ github.ref_name }}" || true
